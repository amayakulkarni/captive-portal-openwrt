<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{NETWORK_NAME}} Portal</title>
    <style>
        :root {
            --primary: #26C6DA;
            --secondary: #E76F51;
            --bg-dark: #101419;
            --card-dark: #1E222A;
            --border-dark: #313A46;
            --text-light: #F0F4F8;
            --text-gray: #B0BEC5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .portal-card {
            background-color: var(--card-dark);
            border: 1px solid var(--border-dark);
            border-radius: 1rem;
            width: 100%;
            max-width: 400px;
            padding: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        header {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        header h1 {
            font-size: 2rem;
            font-weight: 900;
            font-style: italic;
            letter-spacing: -0.05em;
            color: var(--primary);
            text-transform: uppercase;
        }

        header p {
            font-size: 0.875rem;
            color: var(--text-gray);
            margin-top: 0.5rem;
        }

        /* Toggle Tabs Styles */
        .tab-container {
            display: flex;
            background: #151921;
            border: 1px solid var(--border-dark);
            border-radius: 0.5rem;
            margin-bottom: 2rem;
            overflow: hidden;
        }

        .tab-btn {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-gray);
            padding: 0.75rem;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--primary);
            color: #101419;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: 700;
            color: var(--text-gray);
            margin-bottom: 0.5rem;
        }

        .input-field {
            background: #151921;
            border: 1px solid var(--border-dark);
            color: white;
            border-radius: 0.5rem;
            padding: 0.85rem;
            width: 100%;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        .input-field:focus {
            outline: none;
            border-color: var(--primary);
        }

        .btn-primary {
            background-color: var(--primary);
            color: #101419;
            font-weight: 700;
            padding: 1rem;
            border-radius: 0.5rem;
            width: 100%;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 1rem;
            transition: opacity 0.2s, transform 0.2s;
        }

        .btn-primary:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #status-msg {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.875rem;
            padding: 0.75rem;
            border-radius: 0.5rem;
            display: none;
        }

        .status-success {
            display: block !important;
            background: rgba(38, 198, 218, 0.1);
            color: var(--primary);
        }

        .status-error {
            display: block !important;
            background: rgba(231, 111, 81, 0.1);
            color: var(--secondary);
        }

        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="portal-card">
        <header>
            <h1>{{NETWORK_NAME}}</h1>
            <p id="portal-subtitle">Connecting your digital lifestyle</p>
        </header>

        <div class="tab-container">
            <button type="button" class="tab-btn active" id="guest-tab" onclick="switchMode('guest')">Guest</button>
            <button type="button" class="tab-btn" id="throttled-tab" onclick="switchMode('throttled')">Family</button>
        </div>

        <form id="auth-form">
            <div class="form-group">
                <label for="firstName">Your Name</label>
                <input type="text" id="firstName" class="input-field" placeholder="e.g. Rahul" required>
            </div>
            
            <div class="form-group">
                <label for="deviceName">Device Nickname</label>
                <input type="text" id="deviceName" class="input-field" placeholder="e.g. Pixel 8" required>
            </div>

            <div id="guest-section" class="form-group">
                <label for="passcode">Daily Passcode</label>
                <input type="password" id="passcode" class="input-field" placeholder="Enter today's code">
            </div>

            <div id="throttled-section" class="hidden">
                <div class="form-group">
                    <label for="adminUser">Admin Username</label>
                    <input type="text" id="adminUser" class="input-field" placeholder="Username">
                </div>
                <div class="form-group">
                    <label for="adminPass">Admin Password</label>
                    <input type="password" id="adminPass" class="input-field" placeholder="••••••••">
                </div>
            </div>

            <button type="submit" id="submit-btn" class="btn-primary">AUTHENTICATE DEVICE</button>
        </form>

        <div id="status-msg"></div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let currentType = urlParams.get('type') || 'guest';

        function switchMode(mode) {
            currentType = mode;
            const subtitle = document.getElementById('portal-subtitle');
            const guestSection = document.getElementById('guest-section');
            const throttledSection = document.getElementById('throttled-section');
            const guestTab = document.getElementById('guest-tab');
            const throttledTab = document.getElementById('throttled-tab');

            // Reset tabs
            guestTab.classList.remove('active');
            throttledTab.classList.remove('active');

            if (mode === 'guest') {
                guestTab.classList.add('active');
                guestSection.classList.remove('hidden');
                throttledSection.classList.add('hidden');
                subtitle.innerText = "Guest Access Portal";
            } else {
                throttledTab.classList.add('active');
                guestSection.classList.add('hidden');
                throttledSection.classList.remove('hidden');
                subtitle.innerText = "Family LAN Authorization";
            }
        }

        // Initialize based on URL or default
        switchMode(currentType);

        document.getElementById('auth-form').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const msg = document.getElementById('status-msg');
            
            btn.disabled = true;
            btn.innerText = "IDENTIFYING HARDWARE...";
            msg.className = "";
            msg.innerText = "";

            const payload = {
                type: currentType,
                firstName: document.getElementById('firstName').value,
                deviceName: document.getElementById('deviceName').value,
                passcode: document.getElementById('passcode').value,
                adminUser: document.getElementById('adminUser').value,
                adminPass: document.getElementById('adminPass').value
            };

            try {
                const res = await fetch('/api/auth', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (data.success) {
                    msg.className = "status-success";
                    msg.innerText = "Access Granted! You are now online.";
                    setTimeout(() => window.location.href = "http://www.google.com", 2000);
                } else {
                    msg.className = "status-error";
                    msg.innerText = data.error || "Authentication Failed";
                    btn.disabled = false;
                    btn.innerText = "TRY AGAIN";
                }
            } catch (err) {
                msg.className = "status-error";
                msg.innerText = "Connection Error to Auth Server";
                btn.disabled = false;
                btn.innerText = "TRY AGAIN";
            }
        };
    </script>
</body>
</html>
